services:
  # ─── Redis (kept for BullMQ compatibility / future use) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: codeguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ─── Redpanda (Kafka-compatible broker) ──────────────────────────────────
  # Lightweight Kafka replacement — no Zookeeper required.
  # Kafka-compatible on port 9092. Admin UI on http://localhost:8080.
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: codeguard-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 512M
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "19092:19092"   # External Kafka API — use this from your host machine
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Redpanda Console (visual topic / message browser) ───────────────────
  redpanda-console:
    image: redpandadata/console:v2.5.2
    container_name: codeguard-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

volumes:
  redis_data:
  redpanda_data:
