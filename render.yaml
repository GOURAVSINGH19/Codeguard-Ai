services:
  # ── CodeGuard AI: Background Worker ─────────────────────────────────────────
  # Runs the Kafka consumer workers (webhookProcessor, reviewProcessor,
  # incrementalIndexer) as a long-running background service on Render.
  - type: worker # "worker" = no HTTP port, runs forever
    name: codeguard-workers
    runtime: docker
    dockerfilePath: ./apps/workers/Dockerfile
    dockerContext: . # build context = monorepo root
    plan: free # Render free tier (512MB RAM, shared CPU)
    autoDeploy: true # auto-redeploy on every push to main
    branch: main
    envVars:
      # ── Kafka / Upstash ───────────────────────────────────────────────────
      - key: KAFKA_BROKERS
        sync: false # set manually in Render dashboard
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false

      # ── Database ──────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ── Review model ──────────────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b # default; override in dashboard
      - key: OPENAI_API_KEY # embeddings for RAG
        sync: false

      # ── GitHub App (installation tokens are minted per repository) ─────────
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

      # ── Runtime ───────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
