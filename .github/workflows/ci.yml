name: CI

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

# Cancel in-progress runs on the same ref (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Type check every workspace package (web, workers, shared packages)
  # ════════════════════════════════════════════════════════════════════════════
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check all packages
        run: pnpm typecheck

  # ════════════════════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint — web app
        run: pnpm --filter web lint

  # ════════════════════════════════════════════════════════════════════════════
  # Unit tests — no real services needed (LLM, DB, Kafka and GitHub are mocked)
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ════════════════════════════════════════════════════════════════════════════
  # Schema and migrations must agree; dependencies must be free of known
  # high-severity advisories.
  # ════════════════════════════════════════════════════════════════════════════
  checks:
    name: Migrations & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drizzle migrations are consistent
        run: pnpm db:check
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Schema has no un-generated changes
        run: |
          pnpm --filter @codeguard/db exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::packages/db/schema changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain packages/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high

  # ════════════════════════════════════════════════════════════════════════════
  # Secret scanning on every push/PR
  # ════════════════════════════════════════════════════════════════════════════
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════════
  # Build — web app and the workers Docker image
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      GROQ_API_KEY: placeholder
      KAFKA_BROKERS: localhost:19092
      GITHUB_APP_WEBHOOK_SECRET: placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build — web app
        run: pnpm --filter web build
      - name: Build — workers Docker image
        run: docker build -f apps/workers/Dockerfile -t codeguard-workers:ci .

  # ════════════════════════════════════════════════════════════════════════════
  # CodeGuard reviewing its own PRs (informational, never blocks a merge)
  #
  # Needs repository secrets CODEGUARD_API_URL and CODEGUARD_API_KEY. `secrets`
  # can't be used in `if:` expressions, so the value is mapped to an env var
  # and checked there.
  # ════════════════════════════════════════════════════════════════════════════
  codeguard-review:
    name: CodeGuard AI Review
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    env:
      CODEGUARD_API_URL: ${{ secrets.CODEGUARD_API_URL }}
      CODEGUARD_API_KEY: ${{ secrets.CODEGUARD_API_KEY }}
    steps:
      - name: Request CodeGuard AI PR review
        if: env.CODEGUARD_API_URL != ''
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "Requesting CodeGuard AI review for $OWNER/$REPO#$PR_NUMBER"

          RESPONSE=$(curl --silent --show-error --fail --max-time 30 \
            -X POST "$CODEGUARD_API_URL/api/github/review" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CODEGUARD_API_KEY" \
            -d "{\"owner\":\"$OWNER\",\"repo\":\"$REPO\",\"pullNumber\":$PR_NUMBER}" 2>&1) || {
              echo "::warning::CodeGuard review request failed (non-blocking): $RESPONSE"
              exit 0
            }
          echo "CodeGuard AI review started: $(echo "$RESPONSE" | head -c 300)"
      - name: Skip (not configured)
        if: env.CODEGUARD_API_URL == ''
        run: echo "CODEGUARD_API_URL secret not set — skipping self-review."
